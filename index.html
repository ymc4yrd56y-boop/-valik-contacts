<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=yes">

  <title>Валік Смерека — Контакти</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #243b55 0%, #141e30 45%, #080c12 100%);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px 25px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(15px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 800;
    }

    .subtitle {
      margin-bottom: 22px;
      color: #cfd6df;
      font-size: 16px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      margin: 14px 0;
      padding: 15px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }

    .browser {
      background: white;
      color: #17202a;
      font-weight: 800;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    }

    .viber {
      background: #7360f2;
    }

    .telegram {
      background: #229ed9;
    }

    .phone {
      background: #20b86b;
    }

    .phone-help {
      margin: -5px 5px 20px;
      color: #c7ced8;
      font-size: 13px;
      line-height: 1.5;
    }

    .number {
      display: block;
      margin-top: 8px;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .business {
      margin-top: 25px;
      color: #bfc7d2;
      font-size: 13px;
    }

    .small {
      margin-top: 20px;
      color: #aeb7c4;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Валік Смерека</h1>

    <div class="subtitle">
      Зв'яжіться зі мною
    </div>

    <a
      class="button browser"
      href="https://ymc4yrd56y-boop.github.io/-valik-contacts/"
      target="_blank"
      rel="noopener noreferrer"
    >
      🌐 Відкрити в браузері
    </a>

    <a
      class="button viber"
      href="https://viber.me/380961469583"
    >
      💬 Написати у Viber
    </a>

    <a
      class="button telegram"
      href="https://t.me/Smereka_Valik"
    >
      ✈️ Написати в Telegram
    </a>

    <a
      class="button phone"
      href="tel:+380961469583"
    >
      📞 Зателефонувати
    </a>

    <div class="phone-help">
      Якщо кнопка не працює — відкрийте сторінку
      у браузері Safari або Chrome
    </div>

    <a
      class="number"
      href="tel:+380961469583"
    >
      +380 96 146 95 83
    </a>

    <div class="business">
      🏪 Магазин побутова техніка
    </div>

    <div class="small">
      Натисніть потрібну кнопку для зв'язку
    </div>

  </div>

</body>
</html>
