<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Валік Смерека — Контакти</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at top,
          #243b55 0%,
          #141e30 45%,
          #080c12 100%
        );
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 38px 25px;

      text-align: center;

      border-radius: 28px;

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.15);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(15px);
    }

    h1 {
      margin: 0 0 8px;

      font-size: 32px;
      font-weight: 800;
    }

    .subtitle {
      margin-bottom: 28px;

      color: #cfd6df;

      font-size: 16px;
    }

    .button {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 60px;

      margin: 14px 0;
      padding: 15px 20px;

      border-radius: 16px;

      text-decoration: none;

      color: white;

      font-size: 18px;
      font-weight: 700;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;

      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    /* VIBER */
    .viber {
      background: #7360f2;
    }

    /* TELEGRAM */
    .telegram {
      background: #229ed9;
    }

    /* PHONE */
    .phone {
      background: #20b86b;
    }

    .number {
      margin-top: 25px;

      font-size: 18px;
      font-weight: 600;

      letter-spacing: 0.5px;
    }

    .small {
      margin-top: 20px;

      color: #aeb7c4;

      font-size: 13px;
      line-height: 1.5;
    }

    .business {
      margin-top: 25px;

      color: #bfc7d2;

      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Валік Смерека</h1>

    <div class="subtitle">
      Зв'яжіться зі мною
    </div>


    <!-- VIBER BUSINESS -->
    <a
      class="button viber"
      href="https://viber.me/380961469583"
      target="_blank"
      rel="noopener noreferrer"
    >
      💬 Написати у Viber
    </a>


    <!-- TELEGRAM -->
    <a
      class="button telegram"
      href="https://t.me/Smereka_Valik"
      target="_blank"
      rel="noopener noreferrer"
    >
      ✈️ Написати в Telegram
    </a>


    <!-- PHONE -->
    <a
      class="button phone"
      href="tel:+380961469583"
    >
      📞 Зателефонувати
    </a>


    <div class="number">
      +380 96 146 95 83
    </div>


    <div class="business">
      🏪 Магазин побутова техніка
    </div>


    <div class="small">
      Натисніть потрібну кнопку для зв'язку
    </div>

  </div>

</body>
</html>
